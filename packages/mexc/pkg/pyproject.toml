[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typed-mexc"
version = "2.3.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "A fully typed, validated async client for the MEXC APIs."
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "typed-core>=0.10.0",
  "betterproto2==0.9.*",
  "httpx",
  "lazy-loader",
  "orjson",
  "pydantic",
  "typing-extensions",
  "websockets",
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}

[project.urls]
Repository = "https://github.com/tribulnation/typed"
Documentation = "https://tribulnation.com/typed/mexc"
Website = "https://tribulnation.com/typed"

[tool.setuptools.package-data]
typed_mexc = ["py.typed", "*.pyi", "**/*.pyi"]
