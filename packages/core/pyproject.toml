[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typed-core"
version = "0.11.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "Shared core types and utilities for typed crypto clients"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "typing-extensions", "httpx>=0.26", "websockets", "orjson", "pydantic",
  "lazy-loader",
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}

[project.optional-dependencies]
grpc = ["grpclib"]

[tool.setuptools.package-data]
typed_core = ["py.typed", "*.pyi", "**/*.pyi"]

[project.urls]
Repository = "https://github.com/tribulnation/typed"
Website = "https://tribulnation.com/typed"
