[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typed-dydx"
version = "3.6.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "A fully typed, validated async client for the dYdX Indexer, Node and CosmosSDK/CometBFT APIs."
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "typed-core>=0.9.0",
  "lazy-loader",
  "betterproto2==0.9.*",
  "grpclib",
  "httpx",
  "typing-extensions",
  "bech32",
  "bip-utils",
  "coincurve",
  "pycryptodome",
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}

[tool.setuptools.package-data]
typed_dydx = ["py.typed", "*.pyi", "**/*.pyi"]

[project.urls]
Repository = "https://github.com/tribulnation/typed"
Documentation = "https://tribulnation.com/typed/dydx"
Website = "https://tribulnation.com/typed"
