name: Release hyperliquid
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  id-token: write
  contents: write
jobs:
  check:
    if: github.event.pull_request.merged == true && github.head_ref == 'release/hyperliquid'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: version
        run: |
          version=$(grep -m1 '^version = ' packages/hyperliquid/pkg/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/typed-hyperliquid/${{ steps.version.outputs.version }}/json")
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: check
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e packages/core
      - run: pip install -e packages/hyperliquid/pkg
      - run: pip install ruff pyright pytest pytest-asyncio build
      - run: ruff check --select TID251 packages/hyperliquid/pkg
      - run: pyright packages/hyperliquid/pkg
      - run: cp packages/hyperliquid/README.md packages/hyperliquid/LICENSE packages/hyperliquid/pkg/
      - run: python -m build packages/hyperliquid/pkg
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/hyperliquid/pkg/dist
      - id: previous_tag
        run: |
          previous=$(git tag -l 'hyperliquid-v*' | sort -V | tail -1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - run: git tag hyperliquid-v${{ needs.check.outputs.version }}
      - run: git push origin hyperliquid-v${{ needs.check.outputs.version }}
      - if: steps.previous_tag.outputs.previous != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hyperliquid-v${{ needs.check.outputs.version }}
          previous_tag: ${{ steps.previous_tag.outputs.previous }}
          generate_release_notes: true
          body: |
            Published to [PyPI](https://pypi.org/project/typed-hyperliquid/${{ needs.check.outputs.version }}/) as `typed-hyperliquid==${{ needs.check.outputs.version }}`.

            ${{ github.event.pull_request.body }}
      - if: steps.previous_tag.outputs.previous == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hyperliquid-v${{ needs.check.outputs.version }}
          generate_release_notes: true
          body: |
            Published to [PyPI](https://pypi.org/project/typed-hyperliquid/${{ needs.check.outputs.version }}/) as `typed-hyperliquid==${{ needs.check.outputs.version }}`.

            ${{ github.event.pull_request.body }}
